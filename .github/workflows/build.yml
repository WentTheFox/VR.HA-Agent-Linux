name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [linux-x64, linux-arm64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            base="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/SteamVRHAAgent/SteamVRHAAgent.csproj)"
            version="$base-ci.$GITHUB_RUN_NUMBER"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Package
        run: packaging/package.sh "${{ matrix.rid }}" "${{ steps.version.outputs.version }}" dist

      - name: Smoke test
        if: matrix.rid == 'linux-x64'
        run: |
          tar -xzf dist/*.tar.gz -C dist
          dist/steamvr-ha-agent-*/app/steamvr-ha-agent --version

      - uses: actions/upload-artifact@v7
        with:
          name: steamvr-ha-agent-${{ matrix.rid }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum *.tar.gz > SHA256SUMS

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
